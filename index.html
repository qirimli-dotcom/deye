<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEYE — гибридные инверторы, ESS и солнечные панели в России</title>
<meta name="description" content="Официальные поставки оборудования DEYE в Россию: гибридные и сетевые инверторы, микроинверторы, аккумуляторы LiFePO4, солнечные панели TOPCON.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --deye-blue:#1c3982;
    --gold:#c49300;
    --gold-soft:#e0b23c;
    --nav-text:#333333;
    --line:rgba(0,0,0,0.08);
    --wrap:1720px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:'Inter',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 40px;}
  @media(max-width:640px){.wrap{padding:0 20px;}}

  ::selection{background:var(--gold);color:#fff;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
  }

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;left:0;right:0;z-index:100;
    padding:16px 0;
    background:#ffffff;
    border-bottom:1px solid var(--line);
  }
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}

  .logo img{height:32px;width:auto;display:block;}
  .logo{flex:none;}

  nav{display:flex;align-items:center;gap:24px;flex-wrap:wrap;row-gap:8px;}
  nav a{
    font-size:15px;color:var(--nav-text);position:relative;
    padding:6px 0;
    transition:color .2s ease;white-space:nowrap;
    display:inline-flex;align-items:center;gap:5px;
  }
  nav a .caret{font-size:10px;opacity:.6;}
  nav a:hover{color:var(--deye-blue);}
  nav a.active{
    color:var(--deye-blue);
  }
  nav a.active::after{
    content:'';position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--gold);
  }

  .header-cta{display:flex;align-items:center;gap:16px;}
  .phone{font-size:14px;color:var(--nav-text);white-space:nowrap;}

  @media(max-width:900px){
    nav{gap:16px;order:3;flex-basis:100%;justify-content:center;padding-top:6px;}
    nav a{font-size:14px;}
    .phone{display:none;}
  }
  @media(max-width:480px){
    nav{gap:10px 14px;}
    nav a{font-size:12.5px;}
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    width:100%;
    height:70vh;
    max-height:720px;
    min-height:320px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
    background:#0d0f12;
    text-align:center;
    padding-bottom:clamp(20px, 5vw, 70px);
  }
  .hero-slides{
    position:absolute;inset:0;
  }
  .hero-slide{
    position:absolute;inset:0;
    background-size:cover;
    background-repeat:no-repeat;
    background-position:center;
    opacity:0;
    transition:opacity 1.2s ease;
  }
  .hero-slide.is-active{
    opacity:1;
  }
  .hero::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(6,7,9,0.88) 0%, rgba(6,7,9,0.55) 22%, rgba(10,10,10,0.4) 45%, rgba(10,10,10,0.45) 100%);
    z-index:1;
  }
  .hero-inner{
    position:relative;z-index:2;width:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:0 20px;
  }
  .hero h1{
    font-family:'Inter',Arial,sans-serif;
    font-weight:800;
    font-size:clamp(28px, 4vw, 48px);
    line-height:1.15;
    max-width:22ch;
    color:#fff;
    text-transform:uppercase;
    letter-spacing:0.005em;
    margin:0;
  }
  .hero-sub{
    max-width:720px;margin-top:28px;
    font-size:17px;line-height:1.6;color:rgba(255,255,255,0.85);
  }
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px;align-items:center;justify-content:center;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--gold);color:#ffffff;
    font-weight:600;font-size:14px;
    padding:15px 30px;border-radius:0;
    border:1px solid var(--gold);
    transition:background .2s ease, color .2s ease, transform .2s ease, box-shadow .2s ease;
    cursor:pointer;
    box-shadow:0 8px 22px -8px rgba(196,147,0,0.55);
  }
  .btn:hover{background:transparent;color:var(--gold-soft);transform:translateY(-1px);}

</style>
</head>

<script>
  (function(){
    // Пробуем несколько вероятных путей/имён для каждого слайда по очереди.
    // Первый, который реально загрузится, и будет использован.
    var candidatesPerSlide = [
      ['img/photo/pic1.webp','img/slider/slide1.webp','img/banner/banner1.webp'],
      ['img/photo/pic2.webp','img/slider/slide2.webp','img/banner/banner2.webp'],
      ['img/photo/pic3.webp','img/slider/slide3.webp','img/banner/banner3.webp'],
      ['img/photo/pic4.webp','img/slider/slide4.webp','img/banner/banner4.webp']
    ];

    var container = document.getElementById('heroSlides');
    var slideEls = [];

    function tryLoad(candidates, idx, onDone){
      if(idx >= candidates.length){ onDone(null); return; }
      var img = new Image();
      img.onload = function(){ onDone(candidates[idx], img.naturalWidth, img.naturalHeight); };
      img.onerror = function(){ tryLoad(candidates, idx+1, onDone); };
      img.src = candidates[idx];
    }

    var loaded = 0;
    var heroEl = document.querySelector('.hero');
    var ratioSet = false;
    candidatesPerSlide.forEach(function(candidates, i){
      var div = document.createElement('div');
      div.className = 'hero-slide';
      container.appendChild(div);
      slideEls[i] = div;
      tryLoad(candidates, 0, function(foundUrl, w, h){
        if(foundUrl){
          div.style.backgroundImage = "url('" + foundUrl + "')";
          div.dataset.loaded = '1';
          if(!ratioSet && w && h){
            heroEl.style.aspectRatio = w + ' / ' + h;
            heroEl.style.height = 'auto';
            ratioSet = true;
          }
        }
        loaded++;
        if(loaded === candidatesPerSlide.length){
          startSlider();
        }
      });
    });

    function startSlider(){
      var working = slideEls.filter(function(el){ return el.dataset.loaded === '1'; });
      if(working.length === 0) return;
      working[0].classList.add('is-active');
      if(working.length < 2) return;
      var current = 0;
      setInterval(function(){
        working[current].classList.remove('is-active');
        current = (current + 1) % working.length;
        working[current].classList.add('is-active');
      }, 4500);
    }
  })();
</script>
